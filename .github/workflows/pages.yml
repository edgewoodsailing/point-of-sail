# Publishes `main` to GitHub Pages. **This is the production deploy**
# (DESIGN.md §6.1): the school site links to the published URL rather than
# serving the simulator itself, because a stateless static page has no use for
# an application server.
#
# It began as a temporary preview for instructor feedback and outlived that
# framing, which is the only reason the name says "preview" — worth renaming the
# next time this file is touched for another reason.
#
# Why `build:pages` rather than `build`: a project site is served from
# https://<org>.github.io/point-of-sail/, so the assets need that prefix. The
# base is passed here rather than set in `vite.config.ts` because a custom domain
# would need "/" again — it follows a DNS decision, not a code one (pos-740.5).

name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two builds at once, but let a queued one finish rather than
# cancelling it: a cancelled deploy would leave the last push unpublished, and
# the whole point is that what instructors see matches `main`.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates the project runs locally. A preview that quietly serves
      # a broken build is worse than one that fails loudly: the audience is
      # instructors giving feedback on the simulator, and they cannot tell a
      # modelling bug from a bad deploy.
      - run: npm run lint
      - run: npm test
      - run: npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
